<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF" />
      <stop offset="50%" stop-color="#E6F7F2" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2756" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2756" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="376" height="456" rx="20" fill="none" stroke="#0D9488" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Subtle Molecular background lines -->
  <g opacity="0.35" stroke="#0D9488" stroke-width="1.5">
    <circle cx="70" cy="80" r="16" fill="none" />
    <circle cx="70" cy="80" r="4" fill="#0D9488" />
    <line x1="86" y1="80" x2="130" y2="60" />
    <circle cx="130" cy="60" r="5" fill="#0D9488" />

    <circle cx="330" cy="110" r="12" fill="none" />
    <circle cx="330" cy="110" r="3" fill="#0D9488" />
    <line x1="320" y1="120" x2="290" y2="150" />
    <circle cx="290" cy="150" r="4" fill="#0D9488" />

    <circle cx="60" cy="380" r="14" fill="none" />
    <circle cx="60" cy="380" r="3" fill="#0D9488" />
    <line x1="74" y1="380" x2="110" y2="400" />
    <circle cx="110" cy="400" r="4" fill="#0D9488" />
  </g>

  <!-- Profile Silhouette (Modern Female Scientific Researcher in Lab Coat) -->
  <g transform="translate(0, 15)">
    <!-- Base Glow -->
    <circle cx="200" cy="190" r="105" fill="#FFFFFF" filter="url(#cardShadow)" />
    <circle cx="200" cy="190" r="100" fill="#F8FAFC" stroke="url(#accentGrad)" stroke-width="3" />

    <!-- Head / Hair Silhouette -->
    <path d="M 160 170 C 150 140 160 100 200 95 C 240 100 250 140 240 170 C 248 185 240 200 235 205 C 220 220 180 220 165 205 C 160 200 152 185 160 170 Z" fill="#0F2756" opacity="0.85" />
    
    <!-- Face Contour -->
    <path d="M 172 155 C 172 190 185 210 200 210 C 215 210 228 190 228 155 C 228 135 215 125 200 125 C 185 125 172 135 172 155 Z" fill="#E2E8F0" />
    
    <!-- Hair Front Waves -->
    <path d="M 162 145 C 175 125 195 120 205 128 C 220 120 235 128 238 145 C 225 138 212 142 200 152 C 188 142 175 138 162 145 Z" fill="#0F2756" opacity="0.9" />

    <!-- Neck & Lab Coat Collar -->
    <path d="M 190 208 L 210 208 L 213 235 L 187 235 Z" fill="#E2E8F0" />
    
    <!-- Lab Coat Shoulders & V-Neck -->
    <path d="M 130 290 C 130 250 165 235 188 235 L 200 255 L 212 235 C 235 235 270 250 270 290 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" />
    
    <!-- Inner Shirt (Teal) -->
    <polygon points="188,235 212,235 200,265" fill="#0D9488" opacity="0.85" />

    <!-- Lab Coat Lapels -->
    <path d="M 185 235 L 195 275 L 175 290" fill="none" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 215 235 L 205 275 L 225 290" fill="none" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Small Pen / Lab badge in pocket -->
    <rect x="228" y="270" width="18" height="20" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="234" y1="264" x2="234" y2="272" stroke="#0D9488" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Status / Replacement Badge -->
  <g transform="translate(200, 375)">
    <!-- Badge Pill -->
    <rect x="-160" y="0" width="320" height="42" rx="21" fill="#FFFFFF" filter="url(#cardShadow)" stroke="#0D9488" stroke-width="1.5" />
    <!-- Camera / Image Upload Icon -->
    <g transform="translate(-138, 12)" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
      <circle cx="12" cy="13" r="4"></circle>
    </g>
    <text x="-95" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F2756">
      Profile Photo Placeholder
    </text>
  </g>

  <!-- Helpful sub-caption -->
  <text x="200" y="440" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">
    Drop your photo in assets/images/ &amp; link in portfolio.js
  </text>
</svg>
